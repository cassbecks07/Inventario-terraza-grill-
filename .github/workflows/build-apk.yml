name: Build Terraza Grill Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android project
        run: |
          mkdir -p android-wrapper
          cd android-wrapper
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Terraza Grill" "com.terrazagrill.inventario" --web-dir ../
          npx cap add android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.terrazagrill.inventario",
            "appName": "Terraza Grill",
            "webDir": "../",
            "server": {
              "url": "https://cassbecks07.github.io/Inventario-terraza-grill-/",
              "cleartext": true
            }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terraza-Grill-Inventario-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
