name: Build Terraza Grill Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Initialize Capacitor Android project
        run: |
          mkdir -p android-wrapper/www
          cd android-wrapper

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://cassbecks07.github.io/Inventario-terraza-grill-/">
            <title>Terraza Grill</title>
          </head>
          <body></body>
          </html>
          EOF

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Terraza Grill" "com.terrazagrill.inventario" --web-dir www

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.terrazagrill.inventario",
            "appName": "Terraza Grill",
            "webDir": "www",
            "server": {
              "url": "https://cassbecks07.github.io/Inventario-terraza-grill-/",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terraza-Grill-Inventario-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
